<div class="grid">
    <div class="col-12 md:col-8 lg:col-6">
        <div class="card">

            <h5 class="mb-4">Gestion du profil</h5>

            <div class="grid formgrid p-fluid">

                <!-- Login -->
                <div class="field col-12">
                    <label for="usr_login" class="font-semibold">Login</label>
                    <input 
                        id="usr_login"
                        type="text"
                        pInputText
                        class="w-full" />
                </div>

                <!-- Mot de passe -->
                <div class="field col-12">
                    <label for="password" class="font-semibold">Mot de passe</label>
                    <p-password 
                        [toggleMask]="true"
                        [feedback]="false"
                        inputStyleClass="w-full">
                    </p-password>
                </div>

                <!-- Prénom -->
                <div class="field col-12 md:col-6">
                    <label for="usr_firstname" class="font-semibold">Prénom(s)</label>
                    <input
                        id="usr_firstname"
                        type="text"
                        pInputText
                        class="w-full" />
                </div>

                <!-- Nom -->
                <div class="field col-12 md:col-6">
                    <label for="usr_lastname" class="font-semibold">Nom</label>
                    <input
                        id="usr_lastname"
                        type="text"
                        pInputText
                        class="w-full" />
                </div>

                <!-- Téléphone -->
                <div class="field col-12">
                    <label for="usr_desc" class="font-semibold">Numéro de téléphone</label>
                    <input
                        id="usr_desc"
                        type="text"
                        pInputText
                        class="w-full" />
                </div>

                

            </div>

            <!-- Boutons -->
            <div class="flex justify-content-end gap-2 mt-4">
                <!-- <button 
                    pButton 
                    label="Annuler"
                    icon="pi pi-times"
                    class="p-button-secondary p-button-outlined">
                </button> -->

                <button 
                    pButton 
                    label="Valider"
                    icon="pi pi-check"
                    class="p-button-primary">
                </button>
            </div>

        </div>
    </div>
</div>
